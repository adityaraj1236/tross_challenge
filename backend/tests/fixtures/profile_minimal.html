<!-- No embedded JSON blob - simulates a page where the data-graph extraction fails and the
     service must fall back to HTML meta tags for whatever minimal data is available. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <title>John Smith | LinkedIn</title>
  <meta name="description" content="Product Manager at Some Company | Austin, Texas" />
  <meta property="og:image" content="https://media.example.com/john-smith.jpg" />
</head>
<body>
  <main>
    <h1>John Smith</h1>
    <p>Product Manager at Some Company</p>
  </main>
</body>
</html>
